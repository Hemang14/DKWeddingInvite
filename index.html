<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Save the Date — Dishakkshi &amp; Kartikay</title>
<meta name="description" content="Save the date — Dishakkshi &amp; Kartikay are getting married, 11 &amp; 12 December 2026, IIDM Resort, Lucknow.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">

<link rel="stylesheet" href="src/css/save-the-date.css?v=3">
</head>
<body>

<div id="envelope">
  <div class="env-layout">
    <div class="env-top">
      <p class="env-kicker">We Are Getting Married</p>
      <p class="env-names">Dishakkshi <span>&amp;</span> Kartikay</p>
    </div>
    <button id="seal" aria-label="Open the save the date">
      <img class="seal-logo" src="resources/images/Logo_green.jpg" alt="Dishakkshi and Kartikay monogram">
    </button>
    <button type="button" class="env-hint" id="env-hint">Tap to open</button>
  </div>
</div>

<main class="std" id="card" aria-hidden="true">
  <div class="std-shimmer" aria-hidden="true"></div>

  <img class="std-motif std-seq std-seq-1" src="resources/images/SaveTheDateGanesha.png" alt="" aria-hidden="true">

  <div class="std-type">
    <h1 class="std-headline std-seq std-seq-2">
      <span>Save</span>
      <em>the</em>
      <span>Date</span>
    </h1>

    <div class="std-seq std-seq-3">
      <p class="std-eyebrow">For the wedding of</p>
      <div class="std-rule"><span>❖</span></div>
    </div>

    <p class="std-names std-seq std-seq-4">
      <span>Dishakkshi</span>
      <em>&amp;</em>
      <span>Kartikay</span>
    </p>
    <div class="std-rule std-rule-sm std-seq std-seq-5"><span>◆</span></div>

    <p class="std-date std-seq std-seq-5">11 &amp; 12 December 2026</p>
    <div class="std-rule std-rule-sm std-seq std-seq-6"><span>❖</span></div>

    <p class="std-venue std-seq std-seq-6" id="std-venue" data-text="IIDM Resort, Lucknow">
      <span class="std-type-text" aria-hidden="true"></span>
      <span class="std-sr-only">IIDM Resort, Lucknow</span>
    </p>

    <p class="std-formal std-seq std-seq-7">Formal invitation to follow</p>
  </div>
</main>

<script src="src/js/save-the-date.js?v=3"></script>
</body>
</html>
