<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#310a12">
<title>Dishakkshi &amp; Kartikay — Save the Date</title>
<meta name="description" content="Save the Date — Dishakkshi &amp; Kartikay, 11 &amp; 12 December 2026, IIDM Resort, Lucknow.">
<meta property="og:title" content="Dishakkshi &amp; Kartikay — Save the Date">
<meta property="og:description" content="Mark your calendars. The formal invitation will follow.">
<meta property="og:image" content="resources/images/camera.png">
<link rel="icon" href="resources/images/kd-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #1a0a05;
    font-family: 'Cormorant Garamond', serif;
    color: #f5e6cc;
    overflow: hidden;
  }

  .std-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Background image */
  .std-bg {
    position: absolute;
    inset: 0;
    background: url('resources/images/camera.png') center center / cover no-repeat;
    opacity: 0;
    animation: fadeInBg 2.5s ease forwards;
  }

  /* Dark overlay for readability */
  .std-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(15, 5, 2, 0.55) 0%,
      rgba(15, 5, 2, 0.72) 50%,
      rgba(15, 5, 2, 0.80) 100%
    );
  }

  /* Content container */
  .std-content {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 2rem 1.5rem;
    max-width: 600px;
    width: 100%;
  }

  /* === Save the Date title — fades in first === */
  .std-title {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(3rem, 10vw, 5.5rem);
    color: #d4af72;
    opacity: 0;
    animation: fadeIn 1.8s ease 0.5s forwards;
    text-shadow: 0 2px 18px rgba(180, 130, 50, 0.45);
    line-height: 1.1;
  }

  /* === Divider + "The Wedding Of" — appears after title === */
  .std-sub-group {
    opacity: 0;
    animation: fadeIn 1.2s ease 2.8s forwards;
    margin-top: 1.2rem;
  }

  .std-rule {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    justify-content: center;
    margin-bottom: 0.8rem;
  }

  .std-rule::before,
  .std-rule::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, #d4af72, transparent);
    max-width: 100px;
  }

  .std-rule span {
    color: #d4af72;
    font-size: 1.1rem;
  }

  .std-wedding-of {
    font-size: clamp(0.75rem, 2.5vw, 0.9rem);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #c9b07a;
    opacity: 0.9;
  }

  /* === Names — typewriter === */
  .std-names {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2.4rem, 8vw, 4.2rem);
    color: #f5e6cc;
    margin-top: 1rem;
    line-height: 1.2;
    min-height: 1.4em;
    text-shadow: 0 1px 12px rgba(200, 160, 80, 0.3);
  }

  .std-names .cursor {
    display: inline-block;
    width: 2px;
    background: #d4af72;
    animation: blink 0.7s step-end infinite;
    vertical-align: middle;
    height: 0.85em;
    margin-left: 2px;
  }

  /* === Date — typewriter === */
  .std-date {
    font-size: clamp(1rem, 3vw, 1.3rem);
    letter-spacing: 0.18em;
    color: #d4af72;
    margin-top: 1.4rem;
    min-height: 1.6em;
    font-weight: 500;
  }

  /* === Address — typewriter === */
  .std-address {
    font-size: clamp(0.85rem, 2.5vw, 1.05rem);
    letter-spacing: 0.12em;
    color: #c9b07a;
    margin-top: 0.6rem;
    opacity: 0.88;
    min-height: 1.5em;
  }

  /* === Formal invitation line — fades in at end === */
  .std-formal {
    margin-top: 2rem;
    font-size: clamp(0.72rem, 2vw, 0.85rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #a8916a;
    opacity: 0;
  }

  @keyframes fadeInBg {
    0%   { opacity: 0; transform: scale(1.04); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  @keyframes fadeInFormal {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
</style>
</head>
<body>

<div class="std-wrap">
  <div class="std-bg"></div>
  <div class="std-overlay"></div>

  <div class="std-content">
    <div class="std-title">Save the Date</div>

    <div class="std-sub-group">
      <div class="std-rule"><span>&#10086;</span></div>
      <p class="std-wedding-of">The Wedding of</p>
    </div>

    <div class="std-names" id="std-names"><span class="cursor"></span></div>
    <div class="std-date"  id="std-date"></div>
    <div class="std-address" id="std-address"></div>
    <p class="std-formal" id="std-formal">Formal Invitation to Follow</p>
  </div>
</div>

<script>
  function typewriter(el, text, startDelay, speed, onDone) {
    let i = 0;
    const cursor = el.querySelector('.cursor');
    setTimeout(() => {
      const timer = setInterval(() => {
        el.textContent = text.slice(0, i + 1);
        i++;
        if (cursor) el.appendChild(cursor);
        if (i >= text.length) {
          clearInterval(timer);
          if (cursor) cursor.style.display = 'none';
          if (onDone) onDone();
        }
      }, speed);
    }, startDelay);
  }

  // Sequence timings (ms from page load)
  // 0ms      : bg starts fading in
  // 500ms    : "Save the Date" starts fading in (2.8s fade)
  // 2800ms   : "The Wedding of" + rule fade in (already CSS animated)
  // 4400ms   : names typewriter starts
  const NAMES_START   = 4400;
  const NAMES_SPEED   = 65;
  const NAMES_TEXT    = 'Dishakkshi & Kartikay';

  const DATE_SPEED    = 55;
  const ADDR_SPEED    = 45;
  const DATE_TEXT     = '11 & 12 · December 2026';
  const ADDR_TEXT     = 'IIDM Resort, Lucknow';

  const namesEl   = document.getElementById('std-names');
  const dateEl    = document.getElementById('std-date');
  const addrEl    = document.getElementById('std-address');
  const formalEl  = document.getElementById('std-formal');

  // 1. Names typewriter
  typewriter(namesEl, NAMES_TEXT, NAMES_START, NAMES_SPEED, () => {
    // 2. Date typewriter (starts after names finish)
    const dateDelay = 500;
    typewriter(dateEl, DATE_TEXT, dateDelay, DATE_SPEED, () => {
      // 3. Address typewriter
      const addrDelay = 400;
      typewriter(addrEl, ADDR_TEXT, addrDelay, ADDR_SPEED, () => {
        // 4. Formal invitation fade-in
        setTimeout(() => {
          formalEl.style.animation = 'fadeInFormal 1.5s ease forwards';
        }, 700);
      });
    });
  });
</script>

</body>
</html>
